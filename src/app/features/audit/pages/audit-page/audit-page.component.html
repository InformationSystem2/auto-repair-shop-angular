<div class="mx-auto flex max-w-7xl flex-col gap-8 animate-in fade-in slide-in-from-bottom-2 duration-700 p-6">
  <div class="flex flex-col gap-1">
    <h1 class="text-3xl font-black tracking-tight" style="color:var(--ds-text)">{{ i18n.translate('audit.title') }}</h1>
    <p class="text-[10px] font-black uppercase tracking-[0.2em]" style="color:var(--ds-overlay0)">
      {{ i18n.translate('audit.subtitle') }}
    </p>
  </div>

  @if (auditState.error()) {
    <div class="rounded-2xl border-2 border-red-200 bg-red-50 p-4 text-xs font-bold uppercase tracking-widest text-red-700 dark:border-red-900/30 dark:bg-red-900/20 dark:text-red-400 shadow-lg shadow-red-900/5">
      <div class="flex items-center gap-3">
        <div class="h-2 w-2 rounded-full bg-red-500"></div>
        {{ auditState.error() }}
      </div>
    </div>
  }

  <app-audit-filters />

  <div class="relative min-h-[400px]">
    @if (auditState.isLoading()) {
      <div class="absolute inset-0 z-20 flex items-center justify-center rounded-[2.5rem] bg-white/30 backdrop-blur-md dark:bg-black/30">
        <div class="flex flex-col items-center gap-3">
          <div class="h-12 w-12 animate-spin rounded-full border-4" style="border-color:var(--ds-surface1); border-top-color:var(--ds-blue)"></div>
          <span class="text-[10px] font-black uppercase tracking-widest" style="color:var(--ds-blue)">{{ i18n.translate('audit.loading') }}</span>
        </div>
      </div>
    }

    <div [class.opacity-50]="auditState.isLoading()" class="transition-opacity duration-200">
      <app-audit-table (viewDetails)="auditState.selectLog($event)" />
    </div>
  </div>

  @if (auditState.selectedLog()) {
    <app-audit-detail-modal
      [log]="auditState.selectedLog()!"
      (close)="auditState.selectLog(null)"
    />
  }
</div>
