<div class="max-w-3xl mx-auto px-4 sm:px-6 py-6">
  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">Notificaciones</h1>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        {{ center.unreadCount() }} sin leer
      </p>
    </div>
    <div class="flex items-center gap-2">
      <button
        (click)="center.refresh()"
        class="p-2.5 rounded-xl text-slate-500 hover:text-indigo-600 hover:bg-white dark:text-slate-400 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-700 transition-all"
        title="Actualizar">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
      @if (center.unreadCount() > 0) {
        <button
          (click)="markAll()"
          class="px-4 py-2.5 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 transition-colors">
          Marcar todas como leídas
        </button>
      }
    </div>
  </div>

  <!-- List -->
  @if (center.notifications().length === 0) {
    <div class="flex flex-col items-center justify-center py-24 text-center">
      <svg class="w-16 h-16 text-slate-300 dark:text-slate-700 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <p class="text-slate-400 text-lg">No tienes notificaciones</p>
    </div>
  } @else {
    <div class="space-y-2">
      @for (n of center.notifications(); track n.id) {
        <button
          (click)="onItemClick(n)"
          class="w-full text-left rounded-2xl px-4 py-4 flex gap-4 border transition-colors"
          [class.bg-white]="n.is_read"
          [class.dark:bg-[#1a1b26]]="n.is_read"
          [class.border-slate-200]="n.is_read"
          [class.dark:border-slate-800]="n.is_read"
          [class.bg-indigo-50/50]="!n.is_read"
          [class.dark:bg-indigo-500/5]="!n.is_read"
          [class.border-indigo-200]="!n.is_read"
          [class.dark:border-indigo-500/30]="!n.is_read"
          [class.hover:bg-slate-50]="true"
          [class.dark:hover:bg-slate-800/40]="true">
          <span class="text-2xl leading-none mt-0.5">{{ typeIcon(n.type) }}</span>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-3">
              <p class="text-base text-slate-800 dark:text-slate-100"
                 [class.font-bold]="!n.is_read" [class.font-medium]="n.is_read">
                {{ n.title }}
              </p>
              @if (!n.is_read) {
                <span class="w-2.5 h-2.5 mt-2 shrink-0 rounded-full bg-pink-500"></span>
              }
            </div>
            <p class="text-sm text-slate-600 dark:text-slate-400 mt-1 whitespace-pre-line">{{ n.body }}</p>
            <p class="text-xs text-slate-400 mt-2">{{ n.sent_at | date:'dd MMM yyyy, HH:mm' }}</p>
          </div>
        </button>
      }
    </div>
  }
</div>
