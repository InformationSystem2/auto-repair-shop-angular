<div class="relative" [class.z-50]="isOpen()">
  <!-- Bell button -->
  <button
    (click)="toggle()"
    class="relative p-2.5 rounded-full text-slate-500 hover:text-indigo-600 hover:bg-white dark:text-slate-400 dark:hover:text-indigo-400 dark:hover:bg-slate-800 hover:shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-indigo-500/50 border border-transparent hover:border-slate-200 dark:hover:border-slate-700"
    title="Notificaciones">
    @if (center.unreadCount() > 0) {
      <span class="absolute -top-0.5 -right-0.5 min-w-[18px] h-[18px] px-1 flex items-center justify-center text-[10px] font-bold text-white bg-pink-500 border-2 border-white dark:border-[#1a1b26] rounded-full">
        {{ center.unreadCount() > 9 ? '9+' : center.unreadCount() }}
      </span>
    }
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
  </button>

  @if (isOpen()) {
    <!-- Backdrop to close on outside click -->
    <div class="fixed inset-0 z-40" (click)="close()"></div>

    <!-- Dropdown panel -->
    <div class="absolute right-0 mt-2 w-80 sm:w-96 max-h-[70vh] overflow-hidden flex flex-col z-50 rounded-2xl bg-white dark:bg-[#1a1b26] border border-slate-200 dark:border-slate-700 shadow-xl">
      <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100 dark:border-slate-800">
        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-sm">Notificaciones</h3>
        @if (center.unreadCount() > 0) {
          <button (click)="markAll($event)" class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 hover:underline">
            Marcar todas como leídas
          </button>
        }
      </div>

      <div class="overflow-y-auto flex-1">
        @if (recent().length === 0) {
          <div class="px-4 py-10 text-center text-sm text-slate-400">
            No tienes notificaciones
          </div>
        } @else {
          @for (n of recent(); track n.id) {
            <button
              (click)="onItemClick(n)"
              class="w-full text-left px-4 py-3 flex gap-3 border-b border-slate-50 dark:border-slate-800/60 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors"
              [class.bg-indigo-50/40]="!n.is_read"
              [class.dark:bg-indigo-500/5]="!n.is_read">
              <span class="text-lg leading-none mt-0.5">{{ typeIcon(n.type) }}</span>
              <div class="flex-1 min-w-0">
                <div class="flex items-start justify-between gap-2">
                  <p class="text-sm text-slate-800 dark:text-slate-100 truncate"
                     [class.font-bold]="!n.is_read" [class.font-medium]="n.is_read">
                    {{ n.title }}
                  </p>
                  @if (!n.is_read) {
                    <span class="w-2 h-2 mt-1.5 shrink-0 rounded-full bg-pink-500"></span>
                  }
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 mt-0.5">{{ n.body }}</p>
                <p class="text-[11px] text-slate-400 mt-1">{{ n.sent_at | date:'dd MMM, HH:mm' }}</p>
              </div>
            </button>
          }
        }
      </div>

      <a
        [routerLink]="'/app/notifications'"
        (click)="close()"
        class="block text-center px-4 py-3 text-sm font-semibold text-indigo-600 dark:text-indigo-400 border-t border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
        Ver todas
      </a>
    </div>
  }
</div>
