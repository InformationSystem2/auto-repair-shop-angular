<div class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden" style="background-color: var(--ds-bg);">
  
  <div class="absolute inset-0 pointer-events-none overflow-hidden">
    <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full blur-[120px] opacity-30" style="background-color: var(--ds-mauve);"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full blur-[120px] opacity-20" style="background-color: var(--ds-blue);"></div>
  </div>

  <div class="relative w-full max-w-sm animate-in fade-in zoom-in-95 duration-500">
    
    <div class="rounded-[2rem] p-8 md:p-10 border border-white/20 relative overflow-hidden shadow-2xl backdrop-blur-xl" 
         style="background-color: var(--ds-card); box-shadow: 0 25px 50px -12px var(--ds-shadow), inset 0 0 0 1px rgba(255,255,255,0.1);">
      
      <div class="absolute top-0 left-0 right-0 h-1.5 opacity-40" style="background: linear-gradient(90deg, var(--ds-mauve), var(--ds-blue));"></div>

      <h2 class="text-lg font-bold mb-6 flex items-center gap-2" style="color: var(--ds-text);">
        <span class="w-1.5 h-1.5 rounded-full" style="background-color: var(--ds-mauve);"></span>
        @if (stage() === 'email') {
          Recuperar Contraseña
        } @else {
          Restablecer Contraseña
        }
      </h2>

      @if (success()) {
        <div class="p-4 rounded-lg border text-sm font-bold animate-in fade-in slide-in-from-top-1"
             style="background-color: rgba(158, 206, 106, 0.1); border-color: rgba(158, 206, 106, 0.2); color: var(--ds-green);">
          {{ success() }}
        </div>
      }

      @if (error()) {
        <div class="p-3 rounded-lg border text-xs font-bold flex items-center gap-3 animate-in fade-in slide-in-from-top-1 mb-4"
             style="background-color: rgba(247, 118, 142, 0.1); border-color: rgba(247, 118, 142, 0.2); color: var(--ds-red);">
          <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
          {{ error() }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="stage() === 'email' ? sendRecoveryCode() : resetPassword()" class="space-y-5">
        
        @if (stage() === 'email') {
          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest ml-1" style="color: var(--ds-subtext);">
              Correo Electrónico
            </label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" style="color: var(--ds-overlay0);">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
              </div>
              <input
                formControlName="email"
                type="email"
                placeholder="correo@ejemplo.com"
                class="w-full h-12 rounded-xl border pl-11 pr-4 text-sm font-medium outline-none transition-all"
                style="background-color: var(--ds-card-hi); border-color: var(--ds-border-sub); color: var(--ds-text);" />
            </div>
          </div>

          <button
            type="submit"
            [disabled]="loading()"
            class="w-full h-12 rounded-xl text-sm font-black uppercase tracking-widest text-white transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden"
            style="background-color: var(--ds-mauve);">
            <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
            <span class="relative z-10 flex items-center justify-center gap-2">
              @if (loading()) {
                <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                Enviando...
              } @else {
                Enviar Código
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
              }
            </span>
          </button>
        }

        @if (stage() === 'code') {
          @if (devCode()) {
            <div class="p-2 rounded-lg text-center text-xs font-mono" style="background-color: var(--ds-card-hi); color: var(--ds-text);">
              DEV: {{ devCode() }}
            </div>
          }

          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest ml-1" style="color: var(--ds-subtext);">
              Código de Verificación
            </label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" style="color: var(--ds-overlay0);">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
              </div>
              <input
                formControlName="code"
                type="text"
                placeholder="000000"
                maxlength="6"
                class="w-full h-12 rounded-xl border pl-11 pr-4 text-sm font-medium outline-none transition-all tracking-[0.3em] text-center"
                style="background-color: var(--ds-card-hi); border-color: var(--ds-border-sub); color: var(--ds-text);" />
            </div>
          </div>

          <div class="space-y-2">
            <label class="text-[10px] font-black uppercase tracking-widest ml-1" style="color: var(--ds-subtext);">
              Nueva Contraseña
            </label>
            <div class="relative group">
              <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none" style="color: var(--ds-overlay0);">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
              </div>
              <input
                formControlName="newPassword"
                type="password"
                placeholder="Mínimo 8 caracteres"
                class="w-full h-12 rounded-xl border pl-11 pr-4 text-sm font-medium outline-none transition-all"
                style="background-color: var(--ds-card-hi); border-color: var(--ds-border-sub); color: var(--ds-text);" />
            </div>
          </div>

          <div class="flex gap-3">
            <button
              type="button"
              (click)="backToEmail()"
              class="flex-1 h-12 rounded-xl text-sm font-bold uppercase tracking-widest border transition-all active:scale-[0.98]"
              style="border-color: var(--ds-border-sub); color: var(--ds-subtext);">
              Volver
            </button>
            <button
              type="submit"
              [disabled]="loading()"
              class="flex-[2] h-12 rounded-xl text-sm font-black uppercase tracking-widest text-white transition-all active:scale-[0.98] disabled:opacity-50 disabled:cursor-not-allowed group relative overflow-hidden"
              style="background-color: var(--ds-blue);">
              <div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
              <span class="relative z-10 flex items-center justify-center gap-2">
                @if (loading()) {
                  <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
                  Guardando...
                } @else {
                  Restablecer
                }
              </span>
            </button>
          </div>
        }
      </form>
    </div>
  </div>
</div>
